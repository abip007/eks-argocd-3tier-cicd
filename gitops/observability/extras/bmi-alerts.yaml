# Alert rules for the BMI app. Prometheus evaluates them every 30 s; firing alerts go
# to Alertmanager. See them: Grafana -> Alerting -> Alert rules, or Prometheus /alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bmi-cicd
spec:
  groups:
    - name: bmi-cicd
      rules:
        - alert: BmiBackendDown
          expr: sum(up{namespace="bmi-cicd", service="bmi-backend-svc"}) < 1 or absent(up{namespace="bmi-cicd", service="bmi-backend-svc"})
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No BMI backend pod is answering /metrics
            description: Check `kubectl -n bmi-cicd get pods` and the backend logs in Grafana Explore (Loki).

        - alert: BmiHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="bmi-cicd", status_code=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="bmi-cicd"}[5m])) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of BMI API requests fail with 5xx
            description: 'Error ratio is {{ $value | humanizePercentage }}.'

        - alert: BmiHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="bmi-cicd"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: BMI API p95 latency above 1 s
            description: 'p95 is {{ $value | humanizeDuration }}.'

        - alert: BmiPostgresVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace="bmi-cicd", persistentvolumeclaim="data-postgres-0"}
              / kubelet_volume_stats_capacity_bytes{namespace="bmi-cicd", persistentvolumeclaim="data-postgres-0"} < 0.15
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Postgres volume has less than 15% free space
            description: Resize PVC data-postgres-0 (the gp3 StorageClass allows expansion).

    # GitOps / release health: did the last release actually land?
    - name: bmi-cicd-release
      rules:
        - alert: BmiArgoAppOutOfSync
          expr: argocd_app_info{name="bmi-cicd", sync_status!="Synced"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: Argo CD app bmi-cicd has been {{ $labels.sync_status }} for 15 minutes
            description: A release commit isn't applied. Argo CD UI → bmi-cicd → sync errors.

        - alert: BmiArgoAppUnhealthy
          expr: argocd_app_info{name="bmi-cicd", health_status!~"Healthy|Progressing"} == 1
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: Argo CD app bmi-cicd is {{ $labels.health_status }}
            description: Check `kubectl -n bmi-cicd get pods` (ImagePullBackOff, CrashLoopBackOff).

        - alert: BmiMixedVersions
          expr: count(count by (version) (bmi_app_info{namespace="bmi-cicd"})) > 1
          for: 20m
          labels: { severity: warning }
          annotations:
            summary: Backend pods run more than one version for 20 minutes
            description: A rollout is stuck. `kubectl -n bmi-cicd rollout status deploy/bmi-backend`.
