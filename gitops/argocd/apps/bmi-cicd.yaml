# The app. Argo CD renders gitops/bmi-cicd/overlays/prod with Kustomize and keeps the
# namespace equal to Git; the pipeline's BuildPush commits new image tags there.
# Created by the root app (gitops/argocd/root-app.yaml) like every file in this folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bmi-cicd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the app removes its ALB rule and pods
spec:
  project: default
  source:
    repoURL: https://github.com/abip007/eks-argocd-3tier-cicd.git
    targetRevision: main
    path: gitops/bmi-cicd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: bmi-cicd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: bmi-backend
      jsonPointers: [/spec/replicas]
