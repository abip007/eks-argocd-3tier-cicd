# App-of-apps. Apply this ONE file (Terraform ships it through the argocd-apps chart,
# the console/CLI guides kubectl-apply it). From then on Argo CD creates every
# Application in gitops/argocd/apps/:
#   bmi-cicd, kube-prometheus-stack, loki, alloy, observability-extras
# New app = new Application YAML in apps/ + git push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting root also deletes its child apps
spec:
  project: default
  source:
    repoURL: https://github.com/abip007/eks-argocd-3tier-cicd.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
