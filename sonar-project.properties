# SonarQube analysis settings (read by pipeline/stages/sonar-scan.sh).
# Host URL and token come from the pipeline, never from this file.
sonar.projectKey=bmi-cicd
sonar.projectName=BMI Health Tracker (CI/CD)
sonar.sourceEncoding=UTF-8

sonar.sources=app/backend/src,app/frontend/src
sonar.tests=app/backend/tests,app/frontend/tests
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/reports/**

# Coverage from Jest (backend) and Vitest (frontend). The same files are left out
# of coverage as in the test configs: process entry points with no logic to test.
sonar.javascript.lcov.reportPaths=app/backend/coverage/lcov.info,app/frontend/coverage/lcov.info
sonar.coverage.exclusions=app/backend/src/server.js,app/backend/src/db.js,app/frontend/src/main.jsx
